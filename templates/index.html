<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо фортуны 🎡</title>
<style>
body { font-family: Arial; display:flex; flex-direction:column; align-items:center; background:#f0f0f0; margin:0; padding:20px; }
h1 { text-align:center; }
#container {
  position: relative;
  width: 90vw;
  max-width: 600px;
  height: 120px;
  overflow: hidden;
  border: 2px solid #333;
  border-radius: 10px;
  background:#fff;
  margin-top:20px;
}
#strip {
  display: flex;
  position: absolute;
  left:0;
  top:0;
  height:100%;
  white-space: nowrap;
}
.strip-item {
  width:100px;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  border-right:1px solid #ccc;
}
.pointer {
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-bottom:30px solid red;
  z-index:10;
}
button { margin-top:20px; padding:12px 25px; font-size:20px; border:none; border-radius:8px; background:#f39c12; color:white; cursor:pointer; }
button:hover { background:#e67e22; }
#result { margin-top:20px; font-size:20px; font-weight:bold; }
</style>
</head>
<body>

<h1>Колесо фортуны 🎡</h1>
<div id="container">
  <div id="strip"></div>
  <div class="pointer"></div>
</div>
<button id="spinBtn">Открыть кейс!</button>
<div id="result"></div>

<script>
const prizes = ["💎","🔫","🎯","🪙","🎁","⚡","🔥","💰"];
const strip = document.getElementById('strip');
const spinBtn = document.getElementById('spinBtn');
const resultDiv = document.getElementById('result');
let spinning = false;
let position = 0;

// создаем полоску с повторением призов
function initStrip(){
  strip.innerHTML='';
  for(let i=0;i<500;i++){
    const item=document.createElement('div');
    item.classList.add('strip-item');
    item.textContent = prizes[i%prizes.length];
    strip.appendChild(item);
  }
}
initStrip();

// функция анимации прокрутки с ускорением и замедлением
function spin(){
  if(spinning) return;
  spinning = true;
  resultDiv.textContent='';

  const baseDistance = Math.random()*500 + 2000; // базовое расстояние
  const speedMultiplier = 10; // ускоряем начальное вращение в 10 раз
  const totalDistance = baseDistance * speedMultiplier; 
  const duration = 6500 + Math.random()*3500; // 6.5–10 секунд
  const startTime = performance.now();

  function animate(time){
    const elapsed = time-startTime;
    const t = Math.min(elapsed/duration,1);
    // ease-out cubic для замедления
    const ease = 1 - Math.pow(1-t,3);
    position = ease * totalDistance;
    strip.style.left = -position + 'px';

    if(t<1){
      requestAnimationFrame(animate);
    } else {
      // определяем приз по центру
      const items = document.querySelectorAll('.strip-item');
      const containerCenter = document.getElementById('container').offsetWidth/2;
      let winner='';
      for(let item of items){
        const rect = item.getBoundingClientRect();
        const containerRect = document.getElementById('container').getBoundingClientRect();
        if(rect.left < containerRect.left + containerCenter && rect.right > containerRect.left + containerCenter){
          winner = item.textContent;
          break;
        }
      }
      resultDiv.textContent=`🎉 Вы выиграли: ${winner} 🎉`;
      spinning=false;
    }
  }
  requestAnimationFrame(animate);
}

spinBtn.addEventListener('click', spin);
</script>

</body>
</html>
