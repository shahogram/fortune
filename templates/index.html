<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо фортуны 🎡</title>
<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f0f0f0;
}

h1 { text-align: center; }

.wheel-container {
    position: relative;
    width: 90vw;
    max-width: 400px;
    aspect-ratio: 1/1;
    margin-top: 20px;
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #333;
    position: relative;
    overflow: hidden;
    transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1);
}

.wheel div {
    position: absolute;
    width: 50%;
    height: 50%;
    top: 50%;
    left: 50%;
    transform-origin: 0% 0%;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding-right: 10px;
    font-weight: bold;
    color: white;
    font-size: 1em;
    border-right: 1px solid #fff;
}

/* Цветные сектора */
.wheel div:nth-child(1) { background-color: #e74c3c; transform: rotate(0deg); }
.wheel div:nth-child(2) { background-color: #3498db; transform: rotate(45deg); }
.wheel div:nth-child(3) { background-color: #f1c40f; transform: rotate(90deg); color:#333; }
.wheel div:nth-child(4) { background-color: #2ecc71; transform: rotate(135deg); }
.wheel div:nth-child(5) { background-color: #9b59b6; transform: rotate(180deg); }
.wheel div:nth-child(6) { background-color: #e67e22; transform: rotate(225deg); }
.wheel div:nth-child(7) { background-color: #1abc9c; transform: rotate(270deg); }
.wheel div:nth-child(8) { background-color: #c0392b; transform: rotate(315deg); }

.pointer {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 30px solid red;
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    transition: transform 0.2s ease;
}

button {
    margin-top: 30px;
    padding: 12px 25px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    background: #f39c12;
    color: white;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover { background: #e67e22; }

#result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #2c3e50;
    text-align: center;
}

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background-color: red;
    pointer-events: none;
    z-index: 1000;
    opacity: 0.8;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>
<body>
<h1>Колесо фортуны 🎡</h1>
<div class="wheel-container">
    <div class="wheel" id="wheel">
        <div>Приз 1</div>
        <div>Приз 2</div>
        <div>Приз 3</div>
        <div>Приз 4</div>
        <div>Приз 5</div>
        <div>Приз 6</div>
        <div>Приз 7</div>
        <div>Приз 8</div>
    </div>
    <div class="pointer" id="pointer"></div>
</div>
<button onclick="spinWheel()">Крутить!</button>
<div id="result"></div>

<!-- Звуковой сигнал -->
<audio id="win-sound">
    <source src="https://www.soundjay.com/button/beep-07.wav" type="audio/wav">
</audio>

<script>
const wheel = document.getElementById('wheel');
const pointer = document.getElementById('pointer');
const resultDiv = document.getElementById('result');
const winSound = document.getElementById('win-sound');
const prizes = ["Приз 1", "Приз 2", "Приз 3", "Приз 4", "Приз 5", "Приз 6", "Приз 7", "Приз 8"];
let spinning = false;

function createConfetti() {
    const confettiCount = 50;
    for (let i = 0; i < confettiCount; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.backgroundColor = hsl(${Math.random()*360}, 100%, 50%);
        confetti.style.animationDuration = 2 + Math.random()*3 + 's';
document.body.appendChild(confetti);
        setTimeout(() => { confetti.remove(); }, 5000);
    }
}

function spinWheel() {
    if (spinning) return;
    spinning = true;
    resultDiv.textContent = "";

    const prizeIndex = Math.floor(Math.random() * prizes.length);
    const degreesPerPrize = 360 / prizes.length;
    const spins = 5;
    const randomOffset = Math.random() * degreesPerPrize;
    const totalDegrees = spins * 360 + prizeIndex * degreesPerPrize + randomOffset;

    wheel.style.transform = rotate(${totalDegrees}deg);

    // Стрелка дергается для реализма
    pointer.style.transform = translateX(-50%) rotate(15deg);
    setTimeout(() => { pointer.style.transform = translateX(-50%) rotate(-10deg); }, 200);
    setTimeout(() => { pointer.style.transform = translateX(-50%) rotate(0deg); }, 400);

    // После остановки
    setTimeout(() => {
        resultDiv.textContent = 🎉 Поздравляем! Вы выиграли: ${prizes[prizeIndex]} 🎉;
        winSound.play();
        createConfetti();
        spinning = false;
    }, 5000);
}
</script>
</body>
</html>
